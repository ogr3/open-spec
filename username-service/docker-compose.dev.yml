version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: username-service-postgres
    environment:
      POSTGRES_DB: usernames
      POSTGRES_USER: username
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "username"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - username-service-pgdata:/var/lib/postgresql/data

volumes:
  username-service-pgdata:
    driver: local
