name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FLYWAY_URL: jdbc:postgresql://localhost:5432/usernames
  FLYWAY_USER: username
  FLYWAY_PASSWORD: secret
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Run mvn verify
        working-directory: username-service
        run: ./mvnw verify

  integration:
    runs-on: ubuntu-latest
    needs: verify
    env:
      ENABLE_DOCKER_TESTS: "true"
      FLYWAY_URL: jdbc:postgresql://localhost:5432/usernames
      FLYWAY_USER: username
      FLYWAY_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Run integration suite
        working-directory: username-service
        run: ./mvnw verify

  docker:
    runs-on: ubuntu-latest
    needs: integration
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/username-service
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} username-service
      - name: Push image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:latest
            docker push $IMAGE_NAME:latest
          fi
